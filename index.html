<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semesterplanering</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="auth-container" class="auth-wrapper">
    <div class="auth-box">
      <div class="auth-logo">Semesterplanering</div>
      <p class="auth-subtitle">Planera personalens semester enkelt</p>
      <div class="auth-tabs">
        <button id="login-tab" class="active">Logga in</button>
        <button id="signup-tab">Skapa konto</button>
      </div>
      <form id="login-form" class="auth-form">
        <label class="ds-label" for="login-email">E-post</label>
        <input class="ds-input" type="email" id="login-email" required placeholder="din@email.se">
        <label class="ds-label" for="login-password">Lösenord</label>
        <input class="ds-input" type="password" id="login-password" required placeholder="Ditt lösenord" minlength="6">
        <button class="ds-btn ds-btn-primary auth-submit" type="submit">Logga in</button>
        <a href="#" id="forgot-link" class="auth-link">Glömt lösenord?</a>
      </form>
      <form id="signup-form" class="auth-form hidden">
        <label class="ds-label" for="signup-email">E-post</label>
        <input class="ds-input" type="email" id="signup-email" required placeholder="din@email.se">
        <label class="ds-label" for="signup-password">Lösenord</label>
        <input class="ds-input" type="password" id="signup-password" required placeholder="Minst 6 tecken" minlength="6">
        <button class="ds-btn ds-btn-primary auth-submit" type="submit">Skapa konto</button>
      </form>
      <form id="reset-form" class="auth-form hidden">
        <label class="ds-label" for="reset-email">E-post</label>
        <input class="ds-input" type="email" id="reset-email" required placeholder="din@email.se">
        <button class="ds-btn ds-btn-primary auth-submit" type="submit">Skicka återställningslänk</button>
        <a href="#" id="back-to-login" class="auth-link">Tillbaka till inloggning</a>
      </form>
      <div id="auth-msg" class="auth-msg"></div>
    </div>
  </div>

  <div id="app-container" class="hidden">
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title">Semesterplanering</span>
        <div id="group-tabs" class="group-tabs"></div>
      </div>
      <div class="topbar-right">
        <span id="period-badge" class="period-badge"></span>
        <button id="export-btn" class="topbar-btn">Exportera</button>
        <button id="dashboard-btn" class="topbar-btn">Översikt</button>
        <button id="settings-btn" class="topbar-btn">Inställningar</button>
        <button id="admin-btn" class="topbar-btn hidden">Admin</button>
        <span id="user-email" class="topbar-email"></span>
        <button id="logout-btn" class="topbar-btn">Logga ut</button>
      </div>
    </header>

    <div class="color-bar">
      <div id="color-palette" class="color-palette"></div>
    </div>
    <div class="app-body">
      <div class="grid-fullscreen" id="vacation-grid"></div>
    </div>

    <div id="settings-overlay" class="overlay hidden">
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Inställningar</span>
          <button id="close-settings" class="panel-close">&times;</button>
        </div>
        <div class="panel-body">
          <div class="panel-section">
            <div class="panel-section-label">Semesterperiod</div>
            <div class="period-controls">
              <select id="year-select" class="ds-select"></select>
              <span class="sep">V</span>
              <select id="start-week" class="ds-select"></select>
              <span class="sep">till V</span>
              <select id="end-week" class="ds-select"></select>
            </div>
            <button id="save-period-btn" class="ds-btn ds-btn-primary" style="width:100%;margin-top:8px;">Spara period</button>
            <div id="period-status" class="period-status"></div>
          </div>

          <div class="panel-section">
            <div class="panel-section-label">Grupper</div>
            <div id="group-list" class="group-manage-list"></div>
            <div class="add-row">
              <input class="ds-input" type="text" id="group-name" placeholder="Ny grupp">
              <button id="add-group-btn" class="ds-btn ds-btn-primary">+</button>
            </div>
          </div>

          <div class="panel-section">
            <div class="panel-section-label">Ledighetstyper</div>
            <div id="leave-type-list" class="leave-type-list"></div>
          </div>

          <div class="panel-section">
            <div class="panel-section-label">Anställda <span id="current-group-name" class="panel-section-hint"></span></div>
            <div class="add-row">
              <input class="ds-input" type="text" id="employee-name" placeholder="Namn på anställd">
              <button id="add-employee-btn" class="ds-btn ds-btn-primary">+</button>
            </div>
            <ul id="employee-list" class="emp-list"></ul>
          </div>
        </div>
      </div>
    </div>

    <div id="dashboard-overlay" class="overlay hidden">
      <div class="panel" style="width:600px;">
        <div class="panel-header">
          <span class="panel-title">Översikt — lediga per vecka</span>
          <button id="close-dashboard" class="panel-close">&times;</button>
        </div>
        <div class="panel-body">
          <div id="dashboard-chart"></div>
        </div>
      </div>
    </div>

    <div id="note-modal" class="overlay hidden">
      <div class="note-modal-box">
        <div class="panel-header">
          <span class="panel-title" id="note-modal-title">Anteckning</span>
          <button id="close-note" class="panel-close">&times;</button>
        </div>
        <div style="padding:16px 20px;">
          <textarea id="note-text" class="ds-input" rows="3" placeholder="Skriv en anteckning..."></textarea>
          <div style="display:flex;gap:8px;margin-top:10px;">
            <button id="save-note-btn" class="ds-btn ds-btn-primary" style="flex:1;">Spara</button>
            <button id="delete-note-btn" class="ds-btn ds-btn-danger" style="flex:1;">Ta bort</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="admin-container" class="hidden">
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title">Admin — Semesterplanering</span>
      </div>
      <div class="topbar-right">
        <button id="admin-back-btn" class="topbar-btn">Tillbaka</button>
        <button id="logout-btn-admin" class="topbar-btn">Logga ut</button>
      </div>
    </header>
    <main class="ds-page">
      <div class="ds-card">
        <div class="ds-card-label">Registrerade användare</div>
        <div id="admin-user-list"></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
