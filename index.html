<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semesterplanering</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="auth-container" class="auth-wrapper">
    <div class="auth-box">
      <div class="auth-logo">Semesterplanering</div>
      <p class="auth-subtitle">Planera personalens semester enkelt</p>
      <div class="auth-tabs">
        <button id="login-tab" class="active">Logga in</button>
        <button id="signup-tab">Skapa konto</button>
      </div>
      <form id="login-form" class="auth-form">
        <label class="ds-label" for="login-email">E-post</label>
        <input class="ds-input" type="email" id="login-email" required placeholder="din@email.se">
        <label class="ds-label" for="login-password">Lösenord</label>
        <input class="ds-input" type="password" id="login-password" required placeholder="Ditt lösenord" minlength="6">
        <button class="ds-btn ds-btn-primary auth-submit" type="submit">Logga in</button>
        <a href="#" id="forgot-link" class="auth-link">Glömt lösenord?</a>
      </form>
      <form id="signup-form" class="auth-form hidden">
        <label class="ds-label" for="signup-email">E-post</label>
        <input class="ds-input" type="email" id="signup-email" required placeholder="din@email.se">
        <label class="ds-label" for="signup-password">Lösenord</label>
        <input class="ds-input" type="password" id="signup-password" required placeholder="Minst 6 tecken" minlength="6">
        <button class="ds-btn ds-btn-primary auth-submit" type="submit">Skapa konto</button>
      </form>
      <form id="reset-form" class="auth-form hidden">
        <label class="ds-label" for="reset-email">E-post</label>
        <input class="ds-input" type="email" id="reset-email" required placeholder="din@email.se">
        <button class="ds-btn ds-btn-primary auth-submit" type="submit">Skicka återställningslänk</button>
        <a href="#" id="back-to-login" class="auth-link">Tillbaka till inloggning</a>
      </form>
      <div id="auth-msg" class="auth-msg"></div>
    </div>
  </div>

  <div id="app-container" class="hidden">
    <header class="topbar">
      <span class="topbar-title">Semesterplanering</span>
      <div class="topbar-right">
        <span id="user-email" class="topbar-email"></span>
        <button id="admin-btn" class="ds-btn hidden">Admin</button>
        <button id="logout-btn" class="ds-btn">Logga ut</button>
      </div>
    </header>

    <main class="ds-page">
      <div class="controls-row">
        <div class="ds-card">
          <div class="ds-card-label">Semesterperiod</div>
          <div class="period-controls">
            <select id="year-select" class="ds-select"></select>
            <span class="sep">från</span>
            <select id="start-week" class="ds-select"></select>
            <span class="sep">till</span>
            <select id="end-week" class="ds-select"></select>
            <button id="save-period-btn" class="ds-btn ds-btn-primary">Spara</button>
          </div>
          <div id="period-status" class="period-status"></div>
        </div>
        <div class="ds-card employees-card">
          <div class="ds-card-label">Anställda</div>
          <div class="add-row">
            <input class="ds-input" type="text" id="employee-name" placeholder="Namn på anställd">
            <button id="add-employee-btn" class="ds-btn ds-btn-primary">Lägg till</button>
          </div>
          <ul id="employee-list" class="emp-list"></ul>
        </div>
      </div>

      <div class="ds-card">
        <div class="ds-card-label">Semesterschema</div>
        <div class="grid-scroll" id="vacation-grid"></div>
      </div>
    </main>
  </div>

  <div id="admin-container" class="hidden">
    <header class="topbar">
      <span class="topbar-title">Admin — Semesterplanering</span>
      <div class="topbar-right">
        <button id="admin-back-btn" class="ds-btn">Tillbaka</button>
        <button id="logout-btn-admin" class="ds-btn">Logga ut</button>
      </div>
    </header>
    <main class="ds-page">
      <div class="ds-card">
        <div class="ds-card-label">Registrerade användare</div>
        <div id="admin-user-list"></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
